# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: bazel

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bazel-almalinux:
    name: bazel almalinux amd64
    runs-on: ubuntu-latest
    container: almalinux:10
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        id: setup
        run: |
          dnf makecache -q --refresh || (sleep 15; dnf makecache -q --refresh)
          dnf upgrade -q -y
          dnf install -q -y \
            ca-certificates \
            curl-minimal \
            findutils \
            gawk \
            git \
            gcc \
            glibc-langpack-en \
            gzip \
            libicu \
            lttng-ust \
            tar \
            zlib
          dnf clean all
          rm -rf /var/cache/yum
          curl --retry 4 --retry-delay 15 -sSLo /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
          . /etc/os-release
          echo "os=${ID}-${VERSION_ID:-rolling}" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-  # yamllint disable-line rule:line-length
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: bash

  bazel-arch:
    name: bazel arch linux amd64
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        id: setup
        run: |
          pacman --needed --noconfirm --noprogressbar -S -u -y \
            ca-certificates \
            curl \
            gawk \
            gcc \
            git \
            gzip \
            icu \
            lttng-ust \
            python \
            tar \
            which \
            zlib
          rm -rf \
            /var/cache/pacman/pkg/* \
            /var/lib/pacman/sync/*
          curl --retry 4 --retry-delay 15 -sSLo /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
          . /etc/os-release
          echo "os=${ID}-${VERSION_ID:-rolling}" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-  # yamllint disable-line rule:line-length
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: bash

  bazel-fedora:
    name: bazel fedora linux amd64
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        id: setup
        run: |
          dnf makecache -q --refresh || (sleep 15; dnf makecache -q --refresh)
          dnf upgrade -q -y
          dnf install -q -y \
            ca-certificates \
            curl \
            findutils \
            gawk \
            gcc \
            git \
            glibc-langpack-en \
            gzip \
            libicu \
            lttng-ust \
            python3 \
            tar \
            which \
            zlib
            dnf clean all
          rm -rf /var/cache/yum
          curl --retry 4 --retry-delay 15 -sSLo /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazelisk
          ln -s /usr/local/bin/bazelisk /usr/local/bin/bazel
          . /etc/os-release
          echo "os=${ID}-${VERSION_ID:-rolling}" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-  # yamllint disable-line rule:line-length
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: bash

  bazel-macos:
    name: bazel macos arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        run: |
          brew update -q || (sleep 15; brew update -q)
          brew install -q \
            bazelisk \
            git
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: zsh -efuo pipefail {0}
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/bazel
            ~/Library/Caches/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: zsh -efuo pipefail {0}

  bazel-ubuntu:
    name: bazel ubuntu amd64
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        id: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
            upgrade
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install \
            ca-certificates \
            curl \
            gawk \
            gcc \
            git \
            gzip \
            libicu78 \
            liblttng-ust1t64 \
            python-is-python3 \
            tar \
            zlib1g
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
          curl --retry 4 --retry-delay 15 -sSLO \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-amd64.deb
          dpkg -i bazelisk-amd64.deb
          rm -rf bazelisk-amd64.deb
          . /etc/os-release
          echo "os=${ID}-${VERSION_ID:-rolling}" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-  # yamllint disable-line rule:line-length
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: bash

  bazel-ubuntu-arm64:
    name: bazel ubuntu arm64
    runs-on: ubuntu-26.04-arm
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: pre-checkout setup
        id: setup
        run: |
          apt-get -qq -o APT::Acquire::Retries=4 update \
            || (sleep 15; apt-get -qq -o APT::Acquire::Retries=4 update)
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
            upgrade
          apt-get -qq -o APT::Acquire::Retries=4 -o Dpkg::Use-Pty=0 \
              --no-install-recommends install \
            ca-certificates \
            curl \
            gawk \
            gcc \
            git \
            gzip \
            libicu78 \
            liblttng-ust1t64 \
            python-is-python3 \
            tar \
            zlib1g
          apt-get -qq -o Dpkg::Use-Pty=0 autoremove
          rm -rf /var/lib/apt/lists/*
          curl --retry 4 --retry-delay 15 -sSLO \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-arm64.deb
          dpkg -i bazelisk-arm64.deb
          rm -rf bazelisk-arm64.deb
          . /etc/os-release
          echo "os=${ID}-${VERSION_ID:-rolling}" >> "$GITHUB_OUTPUT"
          echo "gcc=$(gcc -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.os }}-gcc-${{ steps.setup.outputs.gcc }}-bazel-  # yamllint disable-line rule:line-length
      - name: build package
        run: |
          bazel build \
            --features=treat_warnings_as_errors \
            ...
        shell: bash

  bazel-windows:
    name: bazel windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleInstalled = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              if (-not $moduleInstalled) {
                Install-Module -Force -Name Microsoft.WinGet.Client
                $moduleInstalled = $true
              }
              $package = Get-WinGetPackage -Id Bazel.Bazelisk `
                -MatchOption Equals -ErrorAction SilentlyContinue
              if (-not $package) {
                $result = Install-WinGetPackage -Id Bazel.Bazelisk `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet install failed: $($result.Status)\"
                }
              } elseif ($package.IsUpdateAvailable) {
                $result = Update-WinGetPackage -Id Bazel.Bazelisk `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet update failed: $($result.Status)\"
                }
              }
              $package = Get-WinGetPackage -Id Git.Git `
                -MatchOption Equals -ErrorAction SilentlyContinue
              if (-not $package) {
                $result = Install-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet install failed: $($result.Status)\"
                }
              } elseif ($package.IsUpdateAvailable) {
                $result = Update-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet update failed: $($result.Status)\"
                }
              }
              break
            } catch {
              if ($i -eq 3) { throw }
              if ($moduleInstalled) {
                try { Repair-WinGetPackageManager -Force -Latest } catch {}
              }
              Start-Sleep -Seconds 15
            }
          }
          Add-Content $env:GITHUB_PATH (
            [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
            [System.Environment]::GetEnvironmentVariable("Path", "User"))
        shell: pwsh
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\bazel-cache
            ~\AppData\Local\bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bazelisk build `
            --disk_cache="$env:LOCALAPPDATA\bazel-cache\disk" `
            --features=treat_warnings_as_errors `
            --repository_cache="$env:LOCALAPPDATA\bazel-cache\repo" `
            ...
        shell: pwsh

  bazel-windows-arm64:
    name: bazel windows arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleInstalled = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              if (-not $moduleInstalled) {
                Install-Module -Force -Name Microsoft.WinGet.Client
                $moduleInstalled = $true
              }
              $bazeliskDir = Join-Path $env:LOCALAPPDATA 'Programs\bazelisk'
              $bazeliskExe = Join-Path $bazeliskDir 'bazelisk.exe'
              if (-not (Test-Path $bazeliskExe)) {
                $bazeliskTmp = "$bazeliskExe.tmp"
                New-Item -ItemType Directory -Force -Path $bazeliskDir | Out-Null
                Invoke-WebRequest `
                  -OutFile $bazeliskTmp `
                  -Uri `
                  https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-windows-arm64.exe
                Move-Item -Force $bazeliskTmp $bazeliskExe
              }
              $package = Get-WinGetPackage -Id Git.Git `
                -MatchOption Equals -ErrorAction SilentlyContinue
              if (-not $package) {
                $result = Install-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet install failed: $($result.Status)\"
                }
              } elseif ($package.IsUpdateAvailable) {
                $result = Update-WinGetPackage -Id Git.Git `
                  -MatchOption Equals -Mode Silent
                if ($result.Status -ne 'Ok') {
                  throw \"WinGet update failed: $($result.Status)\"
                }
              }
              break
            } catch {
              if ($i -eq 3) { throw }
              if ($moduleInstalled) {
                try { Repair-WinGetPackageManager -Force -Latest } catch {}
              }
              Start-Sleep -Seconds 15
            }
          }
          Add-Content $env:GITHUB_PATH (
            [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
            [System.Environment]::GetEnvironmentVariable("Path", "User"))
          Add-Content $env:GITHUB_PATH (Join-Path $env:LOCALAPPDATA 'Programs\bazelisk')
        shell: pwsh
      - name: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: post-checkout setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: cache bazel
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\bazel-cache
            ~\AppData\Local\bazelisk
          key: ${{ runner.os }}-${{ runner.arch }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', '**/*.bazel', '**/*.bzl') }}  # yamllint disable-line rule:line-length
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bazel-
      - name: build package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bazelisk build `
            --disk_cache="$env:LOCALAPPDATA\bazel-cache\disk" `
            --features=treat_warnings_as_errors `
            --repository_cache="$env:LOCALAPPDATA\bazel-cache\repo" `
            ...
        shell: pwsh
